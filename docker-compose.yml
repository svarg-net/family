services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: laravel13_api
        restart: unless-stopped
        ports:
            - "8000:8000"
        environment:
            APP_ENV: production
            APP_DEBUG: "false"
            # Настройки Octane / RoadRunner
            OCTANE_SERVER: roadrunner
            OCTANE_WORKERS: "4"          # ставьте по числу ядер CPU
            OCTANE_MAX_REQUESTS: "500"   # авто-перезапуск воркера после N запросов (защита от утечек)
            OCTANE_MAX_MEMORY: "128"     # лимит памяти на воркера, МБ
            # Подключение к PostgreSQL (совпадает с сервисом database)
            DB_CONNECTION: pgsql
            DB_HOST: database
            DB_PORT: 5432
            DB_DATABASE: laravel_api
            DB_USERNAME: laravel
            DB_PASSWORD: secret
        volumes:
            - .:/var/www/html
            - /var/www/html/vendor
            - storage_data:/var/www/html/storage
        depends_on:
            database:
                condition: service_healthy
        networks:
            - laravel_network

    database:
        image: postgres:17-alpine
        container_name: laravel13_db
        restart: unless-stopped
        environment:
            POSTGRES_DB: laravel_api
            POSTGRES_USER: laravel
            POSTGRES_PASSWORD: secret
        volumes:
            - db_data:/var/lib/postgresql/data
        # Для отладки из хоста (например, через DBeaver/pgAdmin) — раскомментируйте:
        # ports:
        #   - "5432:5432"
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U laravel -d laravel_api" ]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - laravel_network

volumes:
    db_data:
    storage_data:

networks:
    laravel_network:
        driver: bridge
